site_name: Databricks 교육 자료
site_description: Databricks Data + AI Platform 한국어 교육 자료 (공식 문서 기반, 주기적 최신화)
site_url: https://myplatforms.github.io/databricks-training/
repo_url: https://github.com/myPlatforms/databricks-training
repo_name: myPlatforms/databricks-training
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: ko
  favicon: https://www.databricks.com/en-website-assets/favicon-32x32.png
  logo: https://www.databricks.com/en-website-assets/icons/icon-96x96.png
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 다크 모드
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

extra_css:
  - assets/extra.css

plugins:
  - search
  - literate-nav:
      nav_file: SUMMARY.md

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

validation:
  links:
    not_found: warn
    anchors: warn
